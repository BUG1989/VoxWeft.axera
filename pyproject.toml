[project]
name = "voxweft"
version = "0.1.0"
description = "Realtime simultaneous interpretation on AX8860 with Qwen3-ASR, HY-MT2, and VoxCPM2 through llama.cpp"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "VoxWeft contributors"}]
keywords = ["ax8860", "axera", "llama.cpp", "simultaneous-interpretation", "qwen3-asr", "voxcpm2", "voice-clone"]
dependencies = [
    "numpy",
    "soundfile",
    "scipy",
    "requests",
    "fastapi",
    "uvicorn",
    "websockets",
]

[project.urls]
Homepage = "https://github.com/BUG1989/VoxWeft.axera"
Repository = "https://github.com/BUG1989/VoxWeft.axera"
Issues = "https://github.com/BUG1989/VoxWeft.axera/issues"
Documentation = "https://github.com/BUG1989/VoxWeft.axera/blob/main/docs/AX8860.md"

[project.optional-dependencies]
# Optional native Apple MLX path retained from upstream VoxWeft.
native = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "requests",
    "mlx-lm>=0.31",
    "mlx-audio>=0.5",
    "mlx-whisper",
    "transformers>=4.50",
]
# Optional endpointing model (measured net-negative for interpretation; see docs/DEVLOG.md).
smartturn = ["pipecat-ai"]
# NLLB fallback translator. CC-BY-NC-4.0 weights — research use only.
nllb = ["torch", "sentencepiece"]
mcp = ["mcp>=1.0"]
bench = ["sacrebleu", "rapidfuzz", "sherpa-onnx"]
dev = ["pytest"]

[project.scripts]
voxweft = "voxweft.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["voxweft*"]

[tool.setuptools.package-data]
"voxweft.runtime" = ["glossary.json"]
